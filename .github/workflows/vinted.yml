name: Vinted Alert

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run Vinted
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python vinted_alert.py

      - name: Run Enjoei
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python enjoei__alert.py

      - name: Persist state
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add seen.json || true
          git add enjoei_seen.json || true
          git diff --staged --quiet || git commit -m "update state"
          git push