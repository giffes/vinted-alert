name: Enjoei Telegram Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Run Enjoei Telegram Test
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python enjoei_telegram_test.py

      - name: Persist state
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add enjoei_test_seen.json || true
          git diff --staged --quiet || git commit -m "update Enjoei test state"
          git push
